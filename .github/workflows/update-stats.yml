name: Update GitHub stats cards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yml"
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch GitHub stats card
        run: |
          curl -sfL "https://github-readme-stats.vercel.app/api?username=SASI1412&show_icons=true&hide_rank=true&bg_color=071426&title_color=39D98A&text_color=C9D8E8&icon_color=39D98A&border_color=163A63&border_radius=12" -o assets/github-stats.svg \
            || echo "::warning::stats card fetch failed, keeping previous version"

      - name: Fetch top languages card
        run: |
          curl -sfL "https://github-readme-stats.vercel.app/api/top-langs/?username=SASI1412&layout=compact&bg_color=071426&title_color=39D98A&text_color=C9D8E8&border_color=163A63&border_radius=12" -o assets/top-langs.svg \
            || echo "::warning::top languages card fetch failed, keeping previous version"

      - name: Fetch trophy case
        run: |
          curl -sfL "https://github-profile-trophy.vercel.app/?username=SASI1412&theme=tokyonight&margin-w=10&margin-h=10" -o assets/trophies.svg \
            || echo "::warning::trophy case fetch failed, keeping previous version"

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh GitHub stats cards"
          git push
